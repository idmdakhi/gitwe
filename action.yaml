name: "gitwe"
description: "Run gitwe git-workflow commands (start, finish, status, graph, doctor, …) against the checked-out repository."
author: "Mohammad Amanalikhani"

branding:
  icon: "git-branch"
  color: "purple"

inputs:
  command:
    description: "gitwe command: start, finish, status, graph, current, list, types, validate, doctor, config, …"
    required: true
  type:
    description: 'Branch type for "start" (feature, release, hotfix, …)'
    required: false
  short-name:
    description: 'Short branch name for "start" (e.g. login)'
    required: false
  branch-name:
    description: 'Full branch name for "finish"'
    required: false
  workflow:
    description: "Built-in workflow: classic | github | gitlab (ignored if config is set)"
    required: false
    default: "classic"
  config:
    description: "Path to a custom workflow config (relative to working-directory)"
    required: false
  delete-branch:
    description: "Delete the branch after finish"
    required: false
    default: "true"
  push:
    description: "Push after finish"
    required: false
    default: "false"
  abort-on-conflict:
    description: "Abort merge on conflict"
    required: false
    default: "false"
  root:
    description: "Root branch for status/graph"
    required: false
    default: "main"
  working-directory:
    description: "Git repository directory (must already be checked out)"
    required: false
    default: "."
  dry-run:
    description: "Only show what would happen"
    required: false
    default: "false"
  strategy:
    description: "Merge strategy: merge | squash | rebase"
    required: false
    default: "merge"
  node-version:
    description: "Node.js version used to run gitwe"
    required: false
    default: "22"

outputs:
  branch-name:
    description: "Created or finished branch name"
    value: ${{ steps.run.outputs.branch-name }}
  merged-into:
    description: "Comma-separated list of branches merged into"
    value: ${{ steps.run.outputs.merged-into }}
  tags:
    description: "Comma-separated list of tags created"
    value: ${{ steps.run.outputs.tags }}
  result-json:
    description: "Full JSON result from the command"
    value: ${{ steps.run.outputs.result-json }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json

    - name: Install & build gitwe
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -d node_modules ]; then
          npm ci --no-fund --no-audit
        fi
        if [ ! -d dist ]; then
          npm run build
        fi

    - name: Run gitwe
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITWE_BIN: ${{ github.action_path }}/dist/cli/index.js
        IN_COMMAND: ${{ inputs.command }}
        IN_TYPE: ${{ inputs.type }}
        IN_SHORT_NAME: ${{ inputs.short-name }}
        IN_BRANCH_NAME: ${{ inputs.branch-name }}
        IN_WORKFLOW: ${{ inputs.workflow }}
        IN_CONFIG: ${{ inputs.config }}
        IN_DELETE_BRANCH: ${{ inputs.delete-branch }}
        IN_PUSH: ${{ inputs.push }}
        IN_ABORT_ON_CONFLICT: ${{ inputs.abort-on-conflict }}
        IN_ROOT: ${{ inputs.root }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
        IN_STRATEGY: ${{ inputs.strategy }}
      run: |
        set -euo pipefail

        GLOBAL_ARGS=(--json)
        if [ -n "${IN_CONFIG:-}" ]; then
          GLOBAL_ARGS+=(--config "$IN_CONFIG")
        else
          GLOBAL_ARGS+=(--workflow "$IN_WORKFLOW")
        fi

        ARGS=("$IN_COMMAND")
        case "$IN_COMMAND" in
          start)
            ARGS+=("$IN_TYPE" "$IN_SHORT_NAME")
            ;;
          finish)
            ARGS+=("$IN_BRANCH_NAME")
            [ "${IN_DELETE_BRANCH}" = "false" ] && ARGS+=(--no-delete)
            [ "${IN_PUSH}" = "true" ] && ARGS+=(--push)
            [ "${IN_ABORT_ON_CONFLICT}" = "true" ] && ARGS+=(--abort-on-conflict)
            [ "${IN_DRY_RUN}" = "true" ] && ARGS+=(--dry-run)
            [ -n "${IN_STRATEGY:-}" ] && ARGS+=(--strategy "$IN_STRATEGY")
            ;;
          validate)
            [ -n "${IN_CONFIG:-}" ] && ARGS+=("$IN_CONFIG")
            ;;
          status|graph)
            ARGS+=(--root "$IN_ROOT")
            ;;
        esac

        set +e
        OUTPUT=$(node "$GITWE_BIN" "${GLOBAL_ARGS[@]}" "${ARGS[@]}")
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"

        {
          echo "result-json<<GITWE_EOF"
          echo "$OUTPUT"
          echo "GITWE_EOF"
        } >> "$GITHUB_OUTPUT"

        BRANCH=$(node -e "try{const r=JSON.parse(process.argv[1]);console.log(r.branchName??r.branch??'')}catch{}" "$OUTPUT")
        MERGED=$(node -e "try{const r=JSON.parse(process.argv[1]);console.log((r.merges||r.updatedBranches||[]).map(m=>typeof m==='string'?m:m.target).join(','))}catch{}" "$OUTPUT")
        TAGS=$(node -e "try{const r=JSON.parse(process.argv[1]);const t=r.tags||(r.tag?[r.tag]:[]);console.log(t.join(','))}catch{}" "$OUTPUT")

        echo "branch-name=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "merged-into=$MERGED" >> "$GITHUB_OUTPUT"
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE

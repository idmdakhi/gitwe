# Classic Git Flow workflow
# Branches: feature/develop → feature/xxx, release/develop → release/xxx, hotfix/main → hotfix/xxx

name: git-flow

branchTypes:
  - name: feature
    prefix: feature/
    baseBranch: develop
    mergeTargets:
      - develop
    deleteOnFinish: true

  - name: release
    prefix: release/
    baseBranch: develop
    mergeTargets:
      - main
      - develop
    deleteOnFinish: true
    autoTag:
      prefix: v
      # pattern: '(\d+\.\d+\.\d+)'  # optional: extract version from branch name

  - name: hotfix
    prefix: hotfix/
    baseBranch: main
    mergeTargets:
      - main
      - develop
    deleteOnFinish: true

hooks:
  preStart:
    - echo "🔍 Checking repository before creating branch..."
  postStart:
    - echo "🎉 Branch created successfully!"
  preFinish:
    - echo "🧪 Running tests before finishing..."
    - npm run test
  postFinish:
    - echo "✅ Branch finished!"

remote:
  remote: origin
  autoPush: false # change to true to auto-push after start/finish
  autoPull: false # change to true to auto-pull before start/finish

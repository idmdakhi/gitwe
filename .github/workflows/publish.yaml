name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test
        run: npm test

      - name: Verify dist exists
        run: |
          test -d dist
          test -f dist/index.js
          test -f dist/cli/index.js
          echo "dist contents:"
          find dist -type f | head -50

      - name: Pack dry-run (must list dist/)
        run: |
          npm pack --dry-run 2>&1 | tee pack-list.txt
          grep -E 'dist/' pack-list.txt
          echo "OK: dist is included in the package"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          retention-days: 1
          # Include everything npm needs; dist is critical
          path: |
            dist/**
            .gitwe/**
            package.json
            package-lock.json
            README.md
            LICENSE
            CHANGELOG.md

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: https://registry.npmjs.org
            package_name: "gitwe"
            token_secret: NPM_TOKEN
            provenance: true
          - registry: https://registry.npmjs.org
            package_name: "@idmdakhi/gitwe"
            token_secret: NPM_TOKEN
            provenance: true
          - registry: https://npm.pkg.github.com
            package_name: "@idmdakhi/gitwe"
            token_secret: GITHUB_TOKEN
            provenance: false

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ matrix.registry }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # Rebuild here so publish never depends only on artifact layout
      - name: Build
        run: npm run build

      - name: Download artifact (overlay dist + metadata)
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifact

      - name: Restore dist and package files from artifact
        run: |
          # Prefer freshly built dist; fall back to artifact if needed
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "dist missing after build — restoring from artifact"
            cp -a artifact/dist ./dist
          fi
          # Optional: keep .gitwe from artifact if present
          if [ -d artifact/.gitwe ]; then
            rm -rf .gitwe
            cp -a artifact/.gitwe ./.gitwe
          fi
          test -d dist
          test -f dist/index.js
          test -f dist/cli/index.js
          echo "dist OK"
          find dist -type f | head -30

      - name: Set package name
        run: npm pkg set name="${{ matrix.package_name }}"

      - name: Verify package contents before publish
        run: |
          npm pack --dry-run 2>&1 | tee pack-list.txt
          if ! grep -qE 'dist/' pack-list.txt; then
            echo "::error::dist/ is NOT included in the npm package"
            echo "Check package.json \"files\" field and that dist exists on disk."
            cat package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);console.log('files:',p.files);console.log('main:',p.main);console.log('bin:',p.bin)})"
            exit 1
          fi
          echo "OK: dist will be published"

      - name: Publish
        run: |
          if [ "${{ matrix.provenance }}" = "true" ]; then
            npm publish --provenance --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}

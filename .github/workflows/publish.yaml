name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test
        run: npm test

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          retention-days: 1
          # Include everything npm needs; dist is critical
          path: |
            dist/**
            .gitwe/**
            package.json
            package-lock.json
            README.md
            LICENSE
            CHANGELOG.md

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: https://npm.pkg.github.com
            package_name: "@idmdakhi/gitwe"
            token_secret: GITHUB_TOKEN
            use_oidc: false
            provenance: false
          - registry: https://registry.npmjs.org
            package_name: "@idmdakhi/gitwe"
            token_secret: NPM_TOKEN
            use_oidc: true
            provenance: true
          - registry: https://registry.npmjs.org
            package_name: "gitwe-ts"
            token_secret: NPM_TOKEN
            use_oidc: true
            provenance: true

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ matrix.registry }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # Rebuild here so publish never depends only on artifact layout
      - name: Build
        run: npm run build

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifact

      - name: Set package name
        run: npm pkg set name="${{ matrix.package_name }}"

      # - name: Publish
      #   run: |
      #     if [ "${{ matrix.provenance }}" = "true" ]; then
      #       npm publish --provenance --access public
      #     else
      #       npm publish --access public
      #     fi
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}

      - name: Publish (OIDC / npm)
        if: matrix.use_oidc
        run:
          npm publish --access public
          # بدون NODE_AUTH_TOKEN — احراز هویت از OIDC می‌آید
          # provenance معمولاً خودکار است

      - name: Publish (token / GitHub Packages)
        if: ${{ !matrix.use_oidc }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}

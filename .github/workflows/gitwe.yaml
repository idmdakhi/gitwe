name: Gitwe Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gitwe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitwe:
    name: Run gitwe commands
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Ensure main and develop exist on remote
        run: |
          git fetch origin
          for branch in main develop; do
            if ! git ls-remote --heads origin "$branch" | grep -q "$branch"; then
              git checkout -B "$branch"
              git push -u origin "$branch"
            fi
          done

      # از action خود پروژه استفاده می‌کند (نه composite setup)
      # چون باید dist ساخته شود و بعد دستورات gitwe اجرا شوند
      - name: Validate workflow config
        uses: ./
        with:
          command: validate
          config: ./.gitwe/gitwe.yaml
        continue-on-error: true

      - name: Check if repo has commits
        id: check
        run: |
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Doctor check
        if: steps.check.outputs.has_commits == 'true'
        uses: ./
        with:
          command: doctor
        continue-on-error: true

      - name: Show status
        if: steps.check.outputs.has_commits == 'true'
        uses: ./
        with:
          command: status

      - name: Show branch graph
        if: steps.check.outputs.has_commits == 'true'
        uses: ./
        with:
          command: graph
          root: main

      - name: Start feature (demo)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          command: start
          type: feature
          short-name: ci-demo-${{ github.run_id }}
        continue-on-error: true

      - name: Finish with dry-run (demo)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          command: finish
          branch-name: feature/ci-demo-${{ github.run_id }}
          dry-run: true
        continue-on-error: true

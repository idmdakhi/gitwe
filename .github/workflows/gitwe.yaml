name: Gitwe Workflow

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gitwe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ضروری برای graph/status

      - name: Configure git for push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Ensure main and develop branches exist on remote
        run: |
          git fetch origin
          # اگر main وجود ندارد، آن را ایجاد کن
          if ! git ls-remote --heads origin main | grep -q main; then
            git checkout -b main
            git push -u origin main
          fi
          # اگر develop وجود ندارد، آن را ایجاد کن
          if ! git ls-remote --heads origin develop | grep -q develop; then
            git checkout -b develop
            git push -u origin develop
          fi

      - name: Validate workflow config
        uses: ./
        with:
          command: validate
          config: ./.gitwe/gitwe.json

      - name: Check if repo has commits
        id: check
        run: |
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "has_commits=true" >> $GITHUB_OUTPUT
          else
            echo "has_commits=false" >> $GITHUB_OUTPUT
          fi

      - name: Doctor check
        if: steps.check.outputs.has_commits == 'true'
        uses: ./
        with:
          command: doctor
        continue-on-error: true # optional

      - name: Show status
        uses: ./
        with:
          command: status

      - name: Show branch graph
        uses: ./
        with:
          command: graph
          root: main

      - name: Start feature branch (PR context)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          command: start
          type: feature
          short-name: ${{ github.head_ref }}
          # env:
          #   PR_BRANCH: ${{ github.head_ref }}
          # run: |
          #   SHORT_NAME=$(echo "$PR_BRANCH" | cut -c1-30 | tr '/' '-')
          #   echo "SHORT_NAME=$SHORT_NAME" >> $GITHUB_ENV

      - name: Finish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./
        with:
          command: finish
          branch-name: ${{ github.ref_name }}
          push: true
          strategy: merge

      # ===== نمونه‌های آموزشی (اختیاری) =====
      - name: Start feature (demo)
        uses: ./
        with:
          command: start
          type: feature
          short-name: login-page

      - name: Finish with dry-run (demo)
        uses: ./
        with:
          command: finish
          branch-name: feature/login-page
          dry-run: true

      - name: Finish with squash strategy (demo)
        uses: ./
        with:
          command: finish
          branch-name: feature/login-page
          strategy: squash
          push: true

name: GitWe Workflow

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gitwe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # مهم برای graph/status

      - name: Validate workflow config
        uses: ./ # action.yml
        with:
          command: validate
          config: ./.gitwe/gitwe.json

      - name: Doctor check
        uses: ./ # action.yml
        with:
          command: doctor

      - name: Start feature branch (PR context)
        if: github.event_name == 'pull_request'
        uses: ./ # action.yml
        with:
          command: start
          type: feature
          short-name: ${{ github.head_ref }}

      - name: Finish release (manual or on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./ # action.yml
        with:
          command: finish
          branch-name: ${{ github.ref_name }}
          push: true

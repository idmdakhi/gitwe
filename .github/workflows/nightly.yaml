name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *" # every night at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  nightly:
    name: Nightly Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Enabled – set secrets.NPM_TOKEN before the first successful run

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Set nightly version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          npm version "${VERSION}-nightly.${TIMESTAMP}" --no-git-tag-version

      - name: Publish to npm with nightly tag
        run: npm publish --tag nightly --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create nightly Git tag
        run: |
          TAG="nightly-$(date +'%Y%m%d')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

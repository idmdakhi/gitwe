name: Compatibility Tests

on:
  schedule:
    - cron: "0 0 * * 1" # هر دوشنبه ساعت ۰۰:۰۰ UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node ${{ matrix.node-version }} + Git ${{ matrix.git-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 22, 20]
        git-version: ["2.30.0", "2.40.0", "2.45.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Git ${{ matrix.git-version }}
        uses: isikerhan/setup-git@v1
        with:
          git-version: ${{ matrix.git-version }}
          cache: true

      - name: Verify Git version
        run: |
          echo "Expected: ${{ matrix.git-version }}"
          git --version
          git --version | grep -E "${{ matrix.git-version }}"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

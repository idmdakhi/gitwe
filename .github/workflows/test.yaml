name: Tests

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  test:
    name: Node ${{ matrix.node }}

    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        node:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      #   - name: Remove release-only test
      #     run: rm -rf tests

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm run test

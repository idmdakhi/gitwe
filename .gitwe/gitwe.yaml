version: 1
name: classic

baseBranches:
  - name: main
    aliases: [master]
    protected: true
  - name: develop
    aliases: [dev]
    base: main
    protected: true

branchTypes:
  - name: feature
    aliases: [feat]
    base: develop
    target: [develop]
    prefix: feature/
  - name: release
    aliases: [rel]
    base: develop
    target: [main, develop]
    prefix: release/
  - name: hotfix
    aliases: [fix]
    base: main
    target: [main, develop]
    prefix: hotfix/
  - name: support
    aliases: [lts]
    base: main
    target: [main]
    prefix: support/

merge:
  strategy: merge
  deleteOnFinish: [feature, release, hotfix]
  squash:
    enabled: true
    default: false
    branchTypes: [feature]

hooks:
  enabled: false
  config: .gitwe/hook.yaml
  path: .gitwe/hooks
  inline:
    pre-start: "echo 'Starting branch $GITWE_BRANCH'"
    post-finish: "echo 'Finished $GITWE_BRANCH → $GITWE_TARGET'"

versioning:
  enabled: true
  config: .gitwe/version.yaml
  tagTypes: [release, hotfix]
  tagTargets: [root] # root = no base on baseBranches
  tagPrefix: v

changelog:
  enabled: false
  config: .gitwe/changelog.yaml

remote:
  config: .gitwe/remote.yaml
  name: origin # for gitwe vscode < v0.23 [deprecated]
  default: origin
  fetch: [origin]
  autoFetch: true
  push: [origin]
  autoPush: false

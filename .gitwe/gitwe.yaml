version: 1
name: classic

baseBranches:
  - name: main
    aliases: [master]
    protected: true
  - name: develop
    aliases: [dev]
    base: main
    protected: true

branchTypes:
  - name: feature
    aliases: [feat]
    base: develop
    target: [develop]
    prefix: feature/
  - name: release
    aliases: [rel]
    base: develop
    target: [main, develop]
    prefix: release/
  - name: hotfix
    aliases: [fix]
    base: main
    target: [main, develop]
    prefix: hotfix/
  - name: support
    aliases: [lts]
    base: main
    target: [main]
    prefix: support/

merge:
  strategy: merge
  deleteOnFinish: [feature, release, hotfix]
  squash:
    enabled: true
    default: false
    branchTypes: [feature]

hooks:
  enabled: true
  path: .gitwe/hooks

versioning:
  enabled: true
  path: .gitwe/version.yaml

changelog:
  enabled: false
  path: ".gitwe/changelog.md"

remote:
  primary: origin
  autoFetch: true
  fetch: [origin]
  autoPush: false
  push: [origin]

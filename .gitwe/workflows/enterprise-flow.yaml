name: enterprise-flow
version: 1
description: "Enterprise workflow with multiple environments"

branches:
  main:
    protected: true
    requiredReviews: 3
  staging:
    protected: true
    requiredReviews: 2
  develop:
    protected: true

types:
  feature:
    prefix: feature/
    base: develop
    target: develop
    deleteAfterFinish: true
  hotfix:
    prefix: hotfix/
    base: main
    target:
      - main
      - develop
      - staging
    deleteAfterFinish: true
  release:
    prefix: release/
    base: staging
    target:
      - main
      - develop
    autoTag:
      prefix: v
    bumpVersion: minor

hooks:
  preStart:
    - echo "Starting branch..."
  postStart:
    - echo "Branch created!"
  preFinish:
    - npm run test
    - npm run build
  postFinish:
    - echo "Branch finished!"

remote:
  remote: origin
  autoPush: true
  autoPull: true

# .gitwe/version.yaml
version: 1

tagTypes: [release, hotfix]
tagTargets: [root] # root = no base on baseBranches
tagPrefix: v
format: "{{tagPrefix}}{{major}}.{{minor}}.{{patch}}" # {{#if prerelease}}-{{prerelease}}{{/if}}"

annotated: true
autoCommit: true
commitMessage: "chore: bump version to {{version}}"

sign: false
pushTags: false

bumpRules:
  major: []
  minor: ["release"]
  patch: ["hotfix"]
  prerelease: []

prerelease:
  enabled: false
  format: "{{type}}.{{number}}"
  types: ["alpha", "beta", "rc"]

initialVersion: "1.0.0"
